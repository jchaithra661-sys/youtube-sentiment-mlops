# Runs the API and dashboard together:  docker compose up --build
# API      -> http://localhost:8000/docs
# Dashboard -> http://localhost:8501
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    ports:
      - "8501:8501"
    volumes:
      - ./models:/app/models
    depends_on:
      - api
